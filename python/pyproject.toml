[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traffic-sim"
version = "0.1.0"
description = "Toronto Transportation Digital Twin — Python periphery (data import, demand, scenarios, evaluation, visualization)"
requires-python = ">=3.12"
license = "MIT"
# The compiled kernel (traffic-sim-kernel, from core/bindings) is installed
# separately via pip/maturin — see README "Getting started". It is not listed
# here because it is not published to PyPI yet (revisit when it is).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "black>=24",
    "maturin>=1.9,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_sim"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The project's enforced linters are ruff + black (see AGENTS.md and CI).
# This section only keeps editor-integrated pylint from reporting false
# positives: compiled extension modules must be allow-listed before pylint
# will introspect their members.
[tool.pylint.main]
extension-pkg-allow-list = ["traffic_sim_kernel"]
